# Product slug used for record operations and generated local assets.
product: keel
# Development process key used when fetching and materializing skills.
process: HELIX01

# Managed worktrees inherit agent-local configuration through keel's safe
# replication layer. Keel copies only gitignored, untracked matches; tracked
# files covered by these presets remain sourced from git and are reported as
# skipped_tracked.
keel:
  worktree:
    replicate:
      presets: [claude, codex]

# Repository-stable defaults used by records import/export helpers.
default_directories:
  catalog: ""
  records: ""
  notebooks: ""

# Named template substitutions used by skill materialization.
placeholders:
  # Command used by generated skills to build the project.
  build_command: [just, build]
  # Primary implementation language for generated skill context.
  primary_language: "Go"

# Optional autonomous-tail executor turn budgets by verb; null uses the compiled
# default. Write null explicitly: openbrain-client 1.7.8 rejects a blank value
# (keel/issue-274).
turn_budgets:
  # Optional max turns for post-merge verify sessions.
  verify: null
  # Optional max turns for dev sessions.
  dev: null
  # Optional max turns for review sessions.
  review: null
  # Optional max turns for merge sessions.
  merge: null

# openbrain-client log file retention. Required since openbrain-client 1.7.8;
# 365 matches openbrain's committed config.
log:
  retention_days: 365

transition_gates:
  prose:
    in_session:
      - [go, run, ./cmd/keel-dev, ci]
      - [go, run, ./cmd/keel-dev, vsix, ci]
    runner_owned: []
  static:
    in_session:
      - [go, run, ./cmd/keel-dev, ci]
      - [go, run, ./cmd/keel-dev, vsix, ci]
    runner_owned: []
  unit:
    in_session:
      - [go, run, ./cmd/keel-dev, ci]
      - [go, run, ./cmd/keel-dev, vsix, ci]
    runner_owned:
      - [go, run, ./cmd/keel-dev, ci]
      - [go, run, ./cmd/keel-dev, vsix, ci]
  integration:
    in_session:
      - [go, run, ./cmd/keel-dev, ci]
      - [go, run, ./cmd/keel-dev, vsix, ci]
    runner_owned:
      - [go, run, ./cmd/keel-dev, ci]
      - [go, run, ./cmd/keel-dev, vsix, ci]
  system:
    in_session:
      - [go, run, ./cmd/keel-dev, ci]
      - [go, run, ./cmd/keel-dev, vsix, ci]
    runner_owned:
      - [go, run, ./cmd/keel-dev, ci]
      - [go, run, ./cmd/keel-dev, vsix, ci]

# Optional non-gating merge command argv for a future openbrain-client merge verb.
merge_command: [bash, .claude/skills/merge/scripts/merge-branch.sh]
